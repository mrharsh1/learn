<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Harsshhh</h1>
    <button id="stop">stop</button>
</body>
<script>
    const say = () => {
        console.log("harshit");
        document.querySelector("h1").innerHTML = "my name is harshit"
    }
    const time = setTimeout(say, 2000)
    document.querySelector('#stop').addEventListener('click', () => {
        clearTimeout(time)
        console.log("sttopped");

    })

</script>

</html>
