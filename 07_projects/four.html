<body style="background-color:#212121; color:#fff;">
  <nav>
    <a href="/" aria-current="page">Home</a>
    <a target="_blank" href="https://www.youtube.com/@chaiaurcode"
      >Youtube channel</a
    >

    <div id="wrapper">
      <h1>Number guessing game</h1>
    <p>Try and guess a random number between 1 and 100.</p>
    <p>You have 10 attempts to guess the right number.</p>
    </br>
        <form class="form">
            <label2 for="guessField" id="guess">Guess a number</label>
            <input type="text" id="guessField" class="guessField">
            <input type="submit" id="subt" value="Submit guess" class="guessSubmit">
        </form>

        <div class="resultParas">
            <p >Previous Guesses: <span class="guesses"></span></p>
            <p >Guesses Remaining: <span class="lastResult">10</span></p>
            <p class="lowOrHi"></p>
        </div>
    </div>
    <script src="chaiaurcode.js">
      let random = parseInt(Math.random() * 100 + 1);
const sub = document.querySelector('#subt');
const guessInput = document.querySelector('#guessField');
const guesSlot = document.querySelector('.guesses');
const remainig = document.querySelector('.lastResult');
const lowOrHi = document.querySelector('.lowOrHi');
const resultParas = document.querySelector('.resultParas');
const p = document.createElement('p');

let pravguess = [];
let numGuess = 1;
let playGame = true;

if (playGame) {
  sub.addEventListener('click', (e) => {
    e.preventDefault();
    const guess = parseInt(guessInput.value);

    console.log(guess);
    validguess(guess);
  });
}

const validguess = (guess) => {
  if (isNaN(guess)) {
    alert('please enter a valid number');
  } else if (guess < 1) {
    alert('please enter a number more than 1');
  } else if (guess > 100) {
    alert('please enter a number less than 100');
  } else {
    pravguess.push(guess);
    if (numGuess === 11) {
      displayguess(guess);
      displayMsg(`Game over, random number was ${random}`);
      endGame();
    } else {
      displayguess(guess);
      checkGuess(guess);
    }
  }
};

const checkGuess = (guess) => {
  if (guess === random) {
    displayMsg(`you guessed it right`);
    endGame();
  } else if (guess < random) {
    displayMsg(`you guessed number is Too low`);
  } else if (guess > random) {
    displayMsg(`you guessed number is Too high`);
  }
};

const displayguess = (guess) => {
  guessInput.value = '';
  guesSlot.innerHTML += `${guess}, `;
  numGuess++;
  remainig.innerHTML = `${11 - numGuess}`;
};
const displayMsg = (msg) => {
  lowOrHi.innerHTML = `<h3>${msg}</h3>`;
};
const endGame = () => {
  guessInput.value = '';
  guessInput.setAttribute('disabled', '');
  p.classList.add('button');
  p.innerHTML = `<h2 id="newgame">Start new game</h2>`;
  resultParas.appendChild(p);
  playGame = false;
  newGame();
};

const newGame = () => {
  const newgameBtn = document.querySelector('#newgame');
  newgameBtn.addEventListener('click', (e) => {
    randomnumber = parseInt(Math.random() * 100 + 1);
    pravguess = [];
    numGuess = 1;
    guesSlot.innerHTML = '';
    remainig.innerHTML = `${11 - numGuess}`;
    guessInput.removeAttribute('disabled');
    resultParas.removeChild(p);
    playGame = true;
  });
};

    </script>
