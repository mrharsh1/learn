<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: darkgray;">
    State	Description
    0	UNSENT	Client has been created. open() not called yet.
    1	OPENED	open() has been called.
    2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
    3	LOADING	Downloading; responseText holds partial data.
    4	DONE	The operation is complete.
</body>
<script>
const reqURL = 'https://api.github.com/users/mrharsh1';
const xhr = new XMLHttpRequest();

xhr.open('GET', reqURL);
xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
        const data = JSON.parse(this.responseText);

        // Create the card container
        const card = document.createElement('div');
        card.style.width = '300px';
        card.style.padding = '20px';
        card.style.backgroundColor = 'white';
        card.style.borderRadius = '10px';
        card.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.1)';
        card.style.textAlign = 'center';
        card.style.margin = '20px auto';
        card.style.fontFamily = 'Arial, sans-serif';

        // Create and append the image
        const img = document.createElement('img');
        img.src = data.avatar_url;
        img.alt = 'User Image';
        img.style.width = '100%';
        img.style.borderRadius = '50%';
        card.appendChild(img);

        // Create and append the name
        const name = document.createElement('h2');
        name.innerText = data.name || 'No Name Available';
        name.style.margin = '10px 0';
        card.appendChild(name);

       
        // Create and append the name
        const followers = document.createElement('h3');
        followers.innerText = data.followers;
        followers.style.margin = '10px 0';
        card.appendChild(followers);
        // Append the card to the body or a specific container
        document.body.appendChild(card);
    }
};

xhr.send();

</script>
</html>
